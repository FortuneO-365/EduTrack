<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized - 401</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md text-center">
        <!-- Icon -->
        <div class="mb-8 flex justify-center">
            <div class="relative">
                <div class="absolute inset-0 bg-red-500 rounded-full blur-2xl opacity-20"></div>
                <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-icon lucide-lock relative text-red-500">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
        </div>

        <!-- Error Code -->
        <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-red-600 mb-4">401</h1>

        <!-- Heading -->
        <h2 class="text-3xl font-bold text-white mb-3">Unauthorized Access</h2>

        <!-- Message -->
        <p class="text-slate-300 text-lg mb-8">
            You don't have permission to access this page. Please log in with the correct credentials or contact an administrator if you believe this is an error.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'login_page' %}" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 shadow-lg hover:shadow-xl">
                Back to Login
            </a>
            <a href="javascript:history.back()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-lg transition duration-200 shadow-lg hover:shadow-xl">
                Go Back
            </a>
        </div>

        <!-- Footer -->
        <div class="mt-12 pt-8 border-t border-slate-700">
            <p class="text-slate-400 text-sm">
                <span class="inline-flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-help-circle-icon lucide-help-circle">
                        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                    </svg>
                    Need help? Contact support
                </span>
            </p>
        </div>
    </div>
</body>
</html>
