<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="  h-screen w-screen md:flex">
        <div class=" h-[150px] overflow-hidden md:w-1/2 md:h-full">
            {% load static %}

            <img src="{% static 'assets/background-1.png' %}" alt="" class="h-full w-full object-cover md:hidden">
            <img src="{% static 'assets/background-2.png' %}" alt="" class=" hidden md:block md:object-cover h-full w-full">
        </div>
        <div class=" flex items-center justify-center bg-white h-[100% - 150px] md:w-1/2 md:h-full">
            <div class=" w-4/5 flex items-center gap-2 flex-col">
                <div class=" size-24">
                    {% load static %}
                    <img src=".{% static 'assets/logo.png' %}" alt="" class="">
                </div>
                <div class=" p-4 w-full">
                    <p class=" text-2xl font-semibold mb-6 text-center">Sign in to your account</p>
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}

                        {% if error %}
                            <p class="text-red-500 mb-4">{{ error }}</p>
                        {% endif %}

                        <div>
                            <p class="font-semibold pb-1">Username</p>
                            <input name="username" type="text" class="w-full border mb-4 p-1.5 outline-none rounded-md">
                        </div>

                        <div>
                            <p class="font-semibold pb-1">Password</p>
                            <input name="password" type="password" class="w-full border mb-4 p-1.5 outline-none rounded-md">
                        </div>

                        <div>
                            <button type="submit" class="w-full border border-blue-400 bg-blue-400 text-white p-1.5 rounded-md">
                                Sign in
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
